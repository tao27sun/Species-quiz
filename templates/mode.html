<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ bank_title }} · 选择模式</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header"><h1>{{ bank_title }}</h1></header>
  <main>
    <section class="bank-picker" aria-labelledby="mode-heading">
      <h2 id="mode-heading">选择模式</h2>
      <form action="{{ url_for('select_bank') }}" method="post">
        <input type="hidden" name="bank" value="{{ sheet }}">
        <button type="submit" name="mode" value="review" class="primary">复习</button>
        <button type="submit" name="mode" value="test" class="primary">测试</button>
      </form>
      <p><a href="{{ url_for('index') }}">返回题库选择</a></p>
    </section>
  </main>
</body>
</html>
